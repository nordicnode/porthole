[package]
name = "shiphand"
version = "0.2.1"
edition = "2021"
description = "Your self-hosted media fleet through one window — automated setup and seamless integration for TorBox, Plex, Jellyfin and the *arr apps."
license = "MIT"
repository = "https://github.com/nordicnode/shiphand"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
getrandom = "0.3"
