name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches Cargo.toml
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER="$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$TAG" != "$VER" ]; then
            echo "tag v$TAG doesn't match Cargo.toml version $VER"
            exit 1
          fi

      - run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist
          tar czf "dist/porthole-x86_64-linux.tar.gz" -C target/release porthole
          (cd dist && sha256sum porthole-x86_64-linux.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            dist/porthole-x86_64-linux.tar.gz dist/SHA256SUMS \
            --title "Porthole ${GITHUB_REF#refs/tags/}" \
            --generate-notes
